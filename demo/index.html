<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeskCal</title>
    <script type="module" src="../src/demo/main.ts" defer></script>
  </head>
  <body>
    <div id="app" data-view="both" data-auth="out">
      <div id="hotspot" data-tauri-drag-region></div>
      <header id="header" data-tauri-drag-region>
        <div id="views" class="views"></div>
        <span id="status" class="status" data-tauri-drag-region></span>
        <button id="btn-pin" class="icon" title="위치·크기 고정" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6z" fill="currentColor"/><path d="M12 14v7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button id="btn-refresh" class="icon" title="새로고침">⟳</button>
        <button id="btn-settings" class="icon" title="설정">⚙</button>
      </header>
      <section id="login">
        <p>Google 계정으로 로그인하면<br />일정과 할 일을 볼 수 있습니다.</p>
        <button id="btn-login">Google 로그인</button>
        <p id="login-msg" class="muted"></p>
      </section>
      <main id="content">
        <section id="calendar"></section>
        <section id="tasks"></section>
      </main>
      <div id="overlay" hidden></div>
      <div id="toast" hidden></div>
    </div>
  </body>
</html>
