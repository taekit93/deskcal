# DeskCal 소개 페이지 배포 (GitHub Pages)
# 공개 전이므로 자동 실행하지 않는다. 공개할 때 Actions 탭에서 "Run workflow"로 수동 실행한다.
# 전제: 저장소가 Public이고, Settings > Pages > Source가 "GitHub Actions"로 설정되어 있어야 한다.
name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
